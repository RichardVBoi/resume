<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <defs>
        <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00fff5;stop-opacity:1"/>
            <stop offset="50%" style="stop-color:#b400ff;stop-opacity:1"/>
            <stop offset="100%" style="stop-color:#ff6b00;stop-opacity:1"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    
    <!-- Dark background -->
    <rect width="100" height="100" fill="#0a0a12"/>
    
    <!-- Outer glow circle -->
    <circle cx="50" cy="50" r="45" stroke="#00fff5" stroke-width="2" fill="none" opacity="0.3"/>
    
    <!-- Main "H" letter with gradient -->
    <text x="50" y="72" 
          font-family="Arial, sans-serif" 
          font-size="65" 
          font-weight="bold" 
          fill="url(#grad)" 
          text-anchor="middle"
          filter="url(#glow)">H</text>
    
    <!-- Inner accent circle -->
    <circle cx="50" cy="50" r="35" stroke="#b400ff" stroke-width="1.5" fill="none" opacity="0.2"/>
</svg>
